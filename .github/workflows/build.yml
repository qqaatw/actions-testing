

name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker-image: quay.io/pypa/musllinux_1_1_i686
            platform: musllinux_1_1_i686
            qemu: false
            pre-cmd: linux32
          - docker-image: quay.io/pypa/musllinux_1_1_x86_64
            platform: musllinux_1_1_x86_64
            qemu: false
            pre-cmd: ""
          - docker-image: quay.io/pypa/musllinux_1_1_aarch64
            platform: musllinux_1_1_aarch64
            qemu: true
            pre-cmd: ""
    steps:
      - name: Set up QEMU
        if: ${{matrix.qemu == true}}
        id: qemu
        uses: docker/setup-qemu-action@v1
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up environment
        run: docker run --rm -e PLAT=$PLAT ${{matrix.docker-image}}
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build wheels
        run: |
          uname -m
          ls -al
          ${{matrix.pre-cmd}} build_wheels.sh
          ls wheelhouse/
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: artifacts
          path: wheelhouse
  deploy:
    needs: build
    #environment: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts